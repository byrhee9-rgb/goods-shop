<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>결제하기 · 굿즈샵</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- 앱(PWA) 설정: 모든 페이지가 같은 내용. 바꿀 때는 8개 파일을 함께 고쳐요 -->

  <link rel="icon" href="icons/icon-192.png" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="bylee-shop" />

  <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1206x2622.png" />
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1242x2688.png" />

  <script src="js/pwa.js" defer></script>
</head>
<body>
  <header id="header"></header>

  <main class="narrow has-pay-bar" style="max-width:640px">
    <h1 class="page-title">결제하기</h1>
    <p class="page-desc">결제 수단을 고르고 [결제하기]를 눌러 주세요.</p>

    <div class="card">
      <div id="item"><p class="loading">상품 정보를 불러오는 중...</p></div>

      <div class="test-note">
        🧪 <b>테스트 결제</b>예요. 실제로 돈이 빠져나가지 않아요. 카드 정보는 아무 값이나 넣어도 돼요.
      </div>

      <!-- 토스 결제위젯이 그려지는 자리 -->
      <div id="payment-method"></div>
      <div id="agreement"></div>

      <div id="message"></div>

      <!-- 폰에서는 화면 아래에 고정돼요 -->
      <div class="pay-bar">
        <div class="pay-total"><span>결제 금액</span><b id="payTotal">-</b></div>
        <button type="button" class="btn" id="payBtn" disabled>결제하기</button>
      </div>
    </div>
  </main>

  <script src="https://js.tosspayments.com/v2/standard"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
